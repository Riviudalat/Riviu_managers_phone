# `cargo deny` policy. Ran in CI; run locally with `cargo deny check`.
#
# Why this exists: 567 crates in `Cargo.lock` and, until this file, **nothing** checking any of
# them for advisories or for a licence the project cannot ship. `npm audit` covered the frontend
# and reported clean; the Rust half had no equivalent at all.

[advisories]
# Fail on any known vulnerability. Unmaintained crates are a warning rather than a failure:
# they are worth seeing, but a transitive dependency going unmaintained should not block a
# security fix from landing.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Permissive licences the project can ship, plus the two weak-copyleft ones that only bind the
# file they cover. Anything outside this list stops CI so the choice is made deliberately rather
# than discovered at release.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # The Mozilla CA root bundle that rustls ships (`webpki-root-certs`). CDLA-Permissive-2.0 is
    # a *data* licence and this is a data set — the certificate list — not code. Allowed
    # deliberately rather than by widening the list.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# The six workspace crates carry no `license` field because they are not published — this is a
# private product, not a library. Without this they each fail as "unlicensed", which would make
# the gate noise rather than signal.
private = { ignore = true }

[bans]
multiple-versions = "allow"
# A wildcard version on a crates.io dependency is a real hazard: the build stops being
# reproducible. A `path = "crates/..."` dependency inside this workspace has no version by
# construction and is not the same thing, so those are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The only non-crates.io sources the project is allowed to pull from.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
