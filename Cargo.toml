[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/android-driver",
  "crates/core",
  "crates/ios-driver",
  "crates/signing",
  "crates/script-engine",
  "tools/rtmmo-re",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Riviu"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "net", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
parking_lot = "0.12"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
sha2 = "0.10"
riviu-android-driver = { path = "crates/android-driver" }
riviu-core = { path = "crates/core" }
riviu-ios-driver = { path = "crates/ios-driver" }
riviu-signing = { path = "crates/signing" }
riviu-script-engine = { path = "crates/script-engine" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
