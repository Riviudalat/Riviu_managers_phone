[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/android-driver",
  "crates/core",
  "crates/ios-driver",
  "crates/signing",
  "crates/script-engine",
  "tools/rtmmo-re",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Riviu"]

# Lint policy, so `cargo clippy` on a dev machine fails on what CI fails on.
#
# CI runs `cargo clippy --workspace --all-targets --locked -- -D warnings`; that `-D` lives in
# the workflow, so locally the same code merely warned and the drift was only discovered on
# push. Denying here moves it back to the machine that wrote the code.
#
# Scoped to clippy on purpose. Putting rustc's own warnings at `deny` would also fail plain
# `cargo build`, so an unused variable would block a half-finished edit. Those stay warnings
# locally and are still denied by CI, which is the one gap this does not close.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Already in the tree (reqwest pulls it); made direct because hand-rolled authority
# parsing is exactly what a review found accepting `https://.tiktok.com/` and rejecting
# `https://www.tiktok.com:443/...`.
url = "2.5"
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "net", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# `log` feature, not just the bare crate: every driver diagnostic in this workspace is a
# `tracing::` macro, and with no subscriber installed those events went **nowhere** --
# measured, `tauri-dev.log` contained not one line while two phones restarted their video
# producer in a loop. The feature makes `tracing` emit `log` records when no subscriber is
# set, which is what `tauri-plugin-log` already collects.
tracing = { version = "0.1", features = ["log"] }
parking_lot = "0.12"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
sha2 = "0.10"
quick-xml = "=0.41.0"
# Structured ISO-BMFF parsing for publish-video validation. Pinned exactly so the accepted
# container/track surface cannot drift without an explicit review.
mp4 = "=0.14.0"
# Already in the graph twice over (tools/rtmmo-re and tauri-plugin-updater), so this adds
# no crate and no licence for cargo-deny to approve.  keeps out
# the encryption and bzip2 backends nothing here reads.
zip = { version = "4.2", default-features = false, features = ["deflate"] }
riviu-android-driver = { path = "crates/android-driver" }
riviu-core = { path = "crates/core" }
riviu-ios-driver = { path = "crates/ios-driver" }
riviu-signing = { path = "crates/signing" }
riviu-script-engine = { path = "crates/script-engine" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
