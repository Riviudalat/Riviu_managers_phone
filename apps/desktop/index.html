<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riviumanagersphone</title>
  </head>
  <body>
    <div
      id="boot-marker"
      style="display:grid;place-items:center;height:100vh;margin:0;color:#606266;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    >
      Loading Riviumanagersphone...
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener("error", (event) => {
        const marker = document.getElementById("boot-marker");
        if (marker) marker.textContent = `UI load error: ${event.message || "unknown error"}`;
      });
      window.addEventListener("unhandledrejection", (event) => {
        const marker = document.getElementById("boot-marker");
        if (marker) marker.textContent = `UI load error: ${String(event.reason || "unknown rejection")}`;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
