[package]
name = "riviu-managers-phone"
version = "0.1.1"
description = "Riviu Manager — iPhone and Android device farm"
authors = ["Riviu"]
edition = "2021"
rust-version = "1.77.2"
default-run = "riviu-managers-phone"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
riviu-android-driver = { workspace = true }
riviu-core = { workspace = true }
riviu-ios-driver = { workspace = true }
riviu-signing = { workspace = true }
riviu-script-engine = { workspace = true }
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { workspace = true }
tauri-plugin-updater = "2"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# USB relay control for the peripherals tier (xiaowei "外设" — power-cycle a wedged phone by
# toggling its relay channel). Cross-platform, pure-Rust FFI (no C toolchain); the enumerate
# path is what the desktop uses to list COM ports for the operator.
serialport = "4"

# Windows ships an OCR engine in the OS (Windows.Media.Ocr, Windows 10+). These
# are Microsoft's own WinRT projections, pure bindings with no runtime of their
# own, so nothing extra has to be installed on a machine that runs the build —
# which rules out Tesseract, whose native library and traineddata would have to
# travel with it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[features]
default = []
