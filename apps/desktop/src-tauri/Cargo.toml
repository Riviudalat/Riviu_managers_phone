[package]
name = "riviu-managers-phone"
version = "0.2.24"
description = "Riviu Manager — iPhone and Android device farm"
authors = ["Riviu"]
edition = "2021"
# Not 1.77.2, which this claimed. `riviu-core` is a path dependency of this crate and
# already uses `Option::is_none_or` (stable 1.82) in five modules, so 1.77.2 has been
# unbuildable for a while -- the number simply went unread. Nothing consumes these crates
# (`publish = false` throughout), so this is documentation, and it should say the version
# the workspace is actually built and tested with: the one in rust-toolchain.toml.
rust-version = "1.95"
default-run = "riviu-managers-phone"
# Never published: this is a private product, not a library. Marking it here also lets
# `cargo deny` treat it as private, so the workspace's own path dependencies are not
# reported as wildcard versions and the missing `license` field is not an error.
publish = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
apk-info = "=1.0.12"
base64 = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
riviu-android-driver = { workspace = true }
riviu-core = { workspace = true }
riviu-ios-driver = { workspace = true }
riviu-signing = { workspace = true }
riviu-script-engine = { workspace = true }
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { workspace = true }
tauri-plugin-updater = "2"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# USB relay control for the peripherals tier (xiaowei "外设" — power-cycle a wedged phone by
# toggling its relay channel). Cross-platform, pure-Rust FFI (no C toolchain); the enumerate
# path is what the desktop uses to list COM ports for the operator.
serialport = "4"

# Windows ships an OCR engine in the OS (Windows.Media.Ocr, Windows 10+). These
# are Microsoft's own WinRT projections, pure bindings with no runtime of their
# own, so nothing extra has to be installed on a machine that runs the build —
# which rules out Tesseract, whose native library and traineddata would have to
# travel with it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[dev-dependencies]
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# `test-util` only, and only for tests — the same line `riviu-core` carries: it unlocks
# `#[tokio::test(start_paused = true)]`, which is what finally lets the three background
# sampler tests advance their five-second turn deadlines virtually instead of sleeping
# six real seconds each. A feature on a crate already in the graph, so `Cargo.lock` is
# untouched.
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
diagnostics = []
deployment-check = []

[lints]
workspace = true

# Helper programs are explicit opt-ins; production bundles include only the app and staged checker.
[[bin]]
name = "capture_frames"
path = "src/bin/capture_frames.rs"
required-features = ["diagnostics"]

[[bin]]
name = "carousel_comment"
path = "src/bin/carousel_comment.rs"
required-features = ["diagnostics"]

[[bin]]
name = "live_app_install_android"
path = "src/bin/live_app_install_android.rs"
required-features = ["diagnostics"]

[[bin]]
name = "live_flow_android"
path = "src/bin/live_flow_android.rs"
required-features = ["diagnostics"]

[[bin]]
name = "live_flow_test"
path = "src/bin/live_flow_test.rs"
required-features = ["diagnostics"]

[[bin]]
name = "live_interaction_android"
path = "src/bin/live_interaction_android.rs"
required-features = ["diagnostics"]

[[bin]]
name = "live_nurture_android"
path = "src/bin/live_nurture_android.rs"
required-features = ["diagnostics"]

[[bin]]
name = "live_nurture_test"
path = "src/bin/live_nurture_test.rs"
required-features = ["diagnostics"]

[[bin]]
name = "riviu-deployment-check"
path = "src/bin/riviu-deployment-check.rs"
required-features = ["deployment-check"]

[[bin]]
name = "swipe_probe"
path = "src/bin/swipe_probe.rs"
required-features = ["diagnostics"]

[[bin]]
name = "video_understanding"
path = "src/bin/video_understanding.rs"
required-features = ["diagnostics"]
