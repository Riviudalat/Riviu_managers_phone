name: Desktop CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  PYTHON_VERSION: "3.12.10"
  NODE_VERSION: "24.15.0"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  quality:
    name: Quality gates
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Configure canonical Git checkout
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            sidecars/pymobiledevice3/requirements.txt
            sidecars/pymobiledevice3/requirements-build.txt
            sidecars/pymobiledevice3/requirements-lock.txt

      - name: Create isolated Python build environment
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/riviu-desktop-venv"
          python -m venv "$venv"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "$venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$venv/bin" >> "$GITHUB_PATH"
          fi
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt --component clippy
          rustup default $env:RUST_TOOLCHAIN
          rustc --version --verbose

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ env.RUST_TOOLCHAIN }}-${{ runner.os }}-${{ runner.arch }}-quality-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'quality Python must be isolated'"
          python -m pip install --disable-pip-version-check --only-binary=cryptography -r sidecars/pymobiledevice3/requirements-build.txt
          python -m pip check

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check Python tooling
        shell: pwsh
        run: |
          python -m py_compile scripts/build_desktop_sidecar.py scripts/build_per_user_wix_resources.py scripts/collect_desktop_ci_artifacts.py scripts/test_build_per_user_wix_resources.py scripts/test_collect_desktop_ci_artifacts.py scripts/stage_deployment_checker.py scripts/test_stage_deployment_checker.py scripts/stage_android_package_tools.py scripts/test_stage_android_package_tools.py scripts/build_xiaowei_parity_matrix.py scripts/check_xiaowei_provenance.py scripts/test_xiaowei_provenance.py sidecars/pymobiledevice3/pyinstaller_runtime_hook.py sidecars/signer/riviu_signer.py sidecars/wda/build_and_install.py sidecars/wda/test_build_and_install.py tools/interaction-gate0/probe.py tools/interaction-gate0/test_probe.py scripts/build_agents_index.py
          node scripts/run_python.mjs scripts/build_desktop_sidecar.py --help
          python scripts/collect_desktop_ci_artifacts.py verify-version
          python -m unittest -v scripts.test_build_per_user_wix_resources scripts.test_collect_desktop_ci_artifacts scripts.test_stage_deployment_checker scripts.test_stage_android_package_tools scripts.test_xiaowei_provenance sidecars.pymobiledevice3.test_app_control sidecars.pymobiledevice3.test_rtmmo_lifecycle sidecars.pymobiledevice3.test_media_stage sidecars.signer.test_riviu_signer sidecars.wda.test_build_and_install
          # The Gate 0 probe: 37 tests over the iOS interaction transport contract -- auth
          # 401/401/200 on every control route and on MJPEG, the exact `POST /url` bodies for
          # direct-video, short-link and photo, and the action-completion boundary that stops a
          # queued pre-action frame becoming evidence.
          #
          # **Added here because it was the only Python in the repo that CI never ran**, which
          # made it the only Python free to rot. It was nominated for deletion as a "macOS-only
          # one-off"; measured, all 37 pass on the Windows runner in ~24 s and nothing but the
          # unused `vision_ocr.swift` beside them is macOS-specific. A suite that green in a
          # minute is worth a minute.
          python -m unittest discover -s tools/interaction-gate0 -p "test_probe.py" -v

          # `docs/agents/README.md` is the only way to resolve a `§9.5` citation after
          # AGENTS.md was split, and the repo holds 200+ of them. It is generated from the
          # headings, so a hand edit or a forgotten regeneration is exactly the drift that
          # made the split necessary -- and the one thing a doc index cannot survive.
          python scripts/build_agents_index.py --check
          python -m unittest scripts.test_build_agents_index scripts.test_check_docs -v
          python scripts/check_docs.py

      # Repo-side digest check for the bundled Android tools. Deliberately in the
      # quality job as well as in the packaged verification: a PR that replaces a
      # binary without regenerating the pin fails in seconds here, instead of after
      # three 120-minute platform builds.
      - name: Verify bundled Android tools
        shell: pwsh
        run: python scripts/collect_desktop_ci_artifacts.py verify-android-tools

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: python scripts/collect_desktop_ci_artifacts.py verify-version --tag "${{ github.ref_name }}"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Lint frontend
        working-directory: apps/desktop
        run: npm run lint

      - name: Test frontend
        working-directory: apps/desktop
        run: npm test

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Enforce clean-room runtime provenance
        shell: pwsh
        run: python scripts/check_xiaowei_provenance.py --runtime crates --runtime apps/desktop/src-tauri/src --runtime sidecars --frontend apps/desktop/dist

      # The e2e suite drives the real UI against a mocked Tauri bridge. It was
      # absent here, so it rotted unnoticed until every test but one failed.
      - name: Install Playwright browser
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      - name: End-to-end test frontend
        working-directory: apps/desktop
        run: npm run test:e2e

      # 567 crates in Cargo.lock and, until this step, nothing checking any of them. `npm audit`
      # already covered the frontend and reports clean; the Rust half had no equivalent at all.
      # Pinned by version so a new cargo-deny release cannot turn a green build red on its own.
      - name: Install cargo-deny
        shell: bash
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check Rust dependencies for advisories and licences
        shell: bash
        run: cargo deny check

      - name: Check npm dependencies for advisories
        working-directory: apps/desktop
        shell: bash
        # `--audit-level=high` rather than the default: a moderate advisory in a dev-only
        # transitive dependency should be visible in the log, not a merge blocker.
        run: npm audit --audit-level=high

      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: apps/desktop/node_modules/.tmp/playwright-results
          retention-days: 7

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - label: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Configure canonical Git checkout
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            sidecars/pymobiledevice3/requirements.txt
            sidecars/pymobiledevice3/requirements-build.txt
            sidecars/pymobiledevice3/requirements-lock.txt

      - name: Create isolated Python build environment
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/riviu-desktop-venv"
          python -m venv "$venv"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "$venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$venv/bin" >> "$GITHUB_PATH"
          fi
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up pinned Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add "${{ matrix.target }}"
          rustc --version --verbose

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ env.RUST_TOOLCHAIN }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'build Python must be isolated'"
          python -m pip install --disable-pip-version-check --only-binary=cryptography -r sidecars/pymobiledevice3/requirements-build.txt
          python -m pip check
          npm ci --prefix apps/desktop

      - name: Verify Mobile MCP canary integration
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/desktop run test:mobile-mcp
          npm --prefix apps/desktop run mobile-mcp:check
          npm --prefix apps/desktop run mobile-mcp:probe

      - name: Fetch yt-dlp sidecar
        shell: bash
        run: |
          set -euo pipefail
          # Downloaded at build time and deliberately NOT pinned by hash. TikTok breaks
          # extractors on its own schedule and the only fix is a newer yt-dlp, so a pinned copy
          # is a pinned failure -- see sidecars/yt-dlp/README.md. Everything else bundled here
          # is byte-pinned; this one is the documented exception.
          #
          # Failing the build is on purpose. The app degrades quietly without yt-dlp (every
          # lookup returns NoBinary and the campaign writes comments from what the phones can
          # see), which is exactly why a missing binary must be loud here: it shipped inert once
          # already, and nothing in the app said so.
          mkdir -p sidecars/yt-dlp
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset=yt-dlp.exe
            out=sidecars/yt-dlp/yt-dlp.exe
          else
            asset=yt-dlp_macos
            out=sidecars/yt-dlp/yt-dlp
          fi
          curl -fsSL --retry 3 --retry-delay 5 \
            -o "$out" \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/$asset"
          chmod +x "$out"
          test -s "$out"
          "$out" --version
          python scripts/collect_desktop_ci_artifacts.py snapshot-yt-dlp \
            --binary "$out" \
            --output sidecars/yt-dlp/yt-dlp-manifest.json

      - name: Stage pinned Android package tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_android_package_tools.py \
            --output target/android-package-tools \
            --cache "${RUNNER_TEMP}/riviu-android-package-tools" \
            --tauri-config target/tauri-android-package-tools.conf.json

      - name: Snapshot production WDA inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/desktop/src-tauri/tauri.full.conf.json
          test -f sidecars/wda/RiviuAgent-candidate.ipa
          test -f sidecars/wda/candidate-manifest.json
          test -f sidecars/wda/RiviuAgent-text.ipa
          test -f sidecars/wda/text-manifest.json
          test -f sidecars/android/android-tools-manifest.json
          test -f sidecars/android/noarch/minicap.apk
          test -f sidecars/android/noarch/scrcpy-server
          test -f sidecars/android/win-x86_64/adb.exe
          # Both DLLs by name: Windows loads them from adb.exe's own directory, so a
          # bundle missing one produces an adb that fails at load time on the operator's
          # machine and nowhere in this pipeline.
          test -f sidecars/android/win-x86_64/AdbWinApi.dll
          test -f sidecars/android/win-x86_64/AdbWinUsbApi.dll
          # The step above fetched it. Asserted here too, beside the other bundled tools,
          # because "the bundle built fine without it" is the failure this whole file exists to
          # make impossible.
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f sidecars/yt-dlp/yt-dlp.exe
          else
            test -f sidecars/yt-dlp/yt-dlp
          fi
          python scripts/collect_desktop_ci_artifacts.py snapshot-production \
            --output target/production-wda-inputs.json \
            --require-canonical-production

      - name: Build and attest native sidecar runtime
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_desktop_sidecar.py \
            --output target/desktop-sidecar \
            --work target/pyinstaller-work \
            --tauri-config target/tauri-sidecar.conf.json

      - name: Build and stage deployment checker sidecar
        shell: bash
        env:
          RIVIU_DEFAULT_AGENT_MODE: full
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --target "${{ matrix.target }}" \
            -p riviu-managers-phone \
            --bin riviu-deployment-check
          if [ "${{ runner.os }}" = "Windows" ]; then
            checker="target/${{ matrix.target }}/release/riviu-deployment-check.exe"
          else
            checker="target/${{ matrix.target }}/release/riviu-deployment-check"
          fi
          python scripts/stage_deployment_checker.py \
            --input "$checker" \
            --output-dir apps/desktop/src-tauri/binaries \
            --target "${{ matrix.target }}"

      # The updater signing key is the one secret that must never reach a build anyone with
      # push access can start. `build:` has no ref filter, so it runs on every PR and every
      # branch push — and a build executes arbitrary repository code (`build.rs`, npm lifecycle
      # hooks, `scripts/build_desktop_sidecar.py`). A branch that edits any of those could read
      # the key straight out of the environment, and with it sign an update that **every
      # installed build accepts**, because the matching pubkey is baked into `tauri.conf.json`.
      #
      # Tag builds are the only ones whose signature has to verify against that pubkey. Every
      # other build gets a keypair minted for that run and thrown away with the runner: the
      # bundler still runs its full signing path (so the build still fails on a bundler
      # regression, which is the reason the keys are mandatory at all), the `.sig` it writes is
      # simply one no installed app would ever accept — and non-tag artifacts are never
      # published, so nothing downstream can mistake it for a release.
      - name: Mint a throwaway updater key (builds that are not a release tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          npx tauri signer generate --ci -f -p "" -w "${RUNNER_TEMP}/updater-throwaway.key"
          # A plain `NAME=value`, not the heredoc form. Measured: the key the generator writes
          # is one line of base64 with **no trailing newline** (348 bytes, 0 newline chars), so
          # a `<<DELIM` block put the closing delimiter on the same line as the key and the
          # runner rejected it with "Matching delimiter not found". A single-line value does not
          # need the multi-line form, and the `$(cat …)` here cannot reintroduce a newline.
          echo "THROWAWAY_SIGNING_KEY=$(cat "${RUNNER_TEMP}/updater-throwaway.key")" >> "$GITHUB_ENV"
          rm -f "${RUNNER_TEMP}/updater-throwaway.key" "${RUNNER_TEMP}/updater-throwaway.key.pub"

      - name: Generate per-user MSI resource fragment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/build_per_user_wix_resources.py `
            --config apps/desktop/src-tauri/tauri.conf.json `
            --config target/tauri-sidecar.conf.json `
            --config target/tauri-android-package-tools.conf.json `
            --fragment-output target/per-user-wix-resources.wxs `
            --config-output target/tauri-per-user-msi.conf.json `
            --target "${{ matrix.target }}"

      - name: Build Tauri installers
        working-directory: apps/desktop
        env:
          # Release artifacts must select the standalone Riviu Agent. The
          # sidecar overlay below supplies the frozen Python/tidevice runtime.
          RIVIU_DEFAULT_AGENT_MODE: full
          # `createUpdaterArtifacts` is on, so the bundler signs the archive and writes a
          # `.sig` beside it. Without these the build fails rather than shipping an
          # unsigned artifact nobody can verify — which is the correct direction: an
          # installed build only accepts an update whose signature matches the pubkey baked
          # into it, so an unsigned release would simply never be taken.
          #
          # The real key appears **only** on a release tag; see the step above. Keeping it in
          # this step's `env:` rather than the job's is deliberate — it is the narrowest scope
          # that still lets the bundler sign.
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || env.THROWAWAY_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm run tauri -- build --ci \
              --target "${{ matrix.target }}" \
              --bundles nsis \
              --config "${{ github.workspace }}/apps/desktop/src-tauri/tauri.full.conf.json" \
              --config "${{ github.workspace }}/target/tauri-sidecar.conf.json" \
              --config "${{ github.workspace }}/target/tauri-android-package-tools.conf.json" \
              -- --locked
            npm run tauri -- build --ci \
              --target "${{ matrix.target }}" \
              --bundles msi \
              --config "${{ github.workspace }}/apps/desktop/src-tauri/tauri.full.conf.json" \
              --config "${{ github.workspace }}/target/tauri-sidecar.conf.json" \
              --config "${{ github.workspace }}/target/tauri-android-package-tools.conf.json" \
              --config "${{ github.workspace }}/target/tauri-per-user-msi.conf.json" \
              -- --locked
          else
            npm run tauri -- build --ci \
              --target "${{ matrix.target }}" \
              --bundles "${{ matrix.bundles }}" \
              --config "${{ github.workspace }}/apps/desktop/src-tauri/tauri.full.conf.json" \
              --config "${{ github.workspace }}/target/tauri-sidecar.conf.json" \
              -- --locked
          fi

      - name: Verify and collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          android_package_tools_args=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            android_package_tools_args=(--android-package-tools target/android-package-tools)
          fi
          python scripts/collect_desktop_ci_artifacts.py collect \
            --target "${{ matrix.target }}" \
            --label "${{ matrix.label }}" \
            --bundle-dir "target/${{ matrix.target }}/release/bundle" \
            --runtime target/desktop-sidecar/riviu-pmd \
            --tauri-config target/tauri-sidecar.conf.json \
            "${android_package_tools_args[@]}" \
            --production-baseline target/production-wda-inputs.json \
            --source-commit "${GITHUB_SHA}" \
            --deployment-profile "${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'internal' }}" \
            --output "target/desktop-ci/${{ matrix.label }}"
          python scripts/check_xiaowei_provenance.py \
            --installer "target/${{ matrix.target }}/release/bundle"
          git diff --exit-code -- \
            sidecars/wda/RiviuAgent.ipa \
            sidecars/wda/Riviumanagersphone.ipa \
            sidecars/wda/agent-manifest.json

      - name: Upload ${{ matrix.label }} artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.label }}
          path: target/desktop-ci/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Configure canonical Git checkout
        run: git config --global core.autocrlf false

      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # This job runs the same collector script as the other two, and the script imports
      # `packaging` at module scope. The other jobs get it as a side effect of installing
      # the sidecar build requirements; this one installed nothing, so every invocation
      # here died on ModuleNotFoundError. It only ever runs on a tag push, so the first tag
      # in the repository was the first time anything executed it.
      #
      # Just the one dependency, and its version read from the lock rather than repeated
      # here — a second copy of a pin is a second thing to forget.
      - name: Install release tooling dependencies
        shell: bash
        run: |
          set -euo pipefail
          pin="$(grep -E '^packaging==' sidecars/pymobiledevice3/requirements-lock.txt)"
          python -m pip install --disable-pip-version-check "$pin"

      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: release-artifacts

      - name: Verify release artifact set
        run: |
          python scripts/collect_desktop_ci_artifacts.py verify-release \
            --root release-artifacts \
            --source-commit "${GITHUB_SHA}" \
            --labels windows-x64 macos-arm64 macos-x64

      # Written outside release-artifacts on purpose: that tree is under a
      # coverage check that fails on any file its checksum lists do not name, and
      # this manifest is signed for by the per-platform signatures it carries
      # rather than by a checksum of its own.
      - name: Build updater manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect_desktop_ci_artifacts.py build-updater-manifest \
            --root release-artifacts \
            --labels windows-x64 macos-arm64 macos-x64 \
            --repo "${{ github.repository }}" \
            --tag "${GITHUB_REF_NAME}" \
            --version "${GITHUB_REF_NAME#v}" \
            --output release-updater/latest.json

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          expected_commit="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$expected_commit" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit $expected_commit does not match workflow SHA $GITHUB_SHA" >&2
            exit 1
          fi
          remote_refs="$(git ls-remote --exit-code --tags origin \
            "refs/tags/${GITHUB_REF_NAME}" \
            "refs/tags/${GITHUB_REF_NAME}^{}")"
          remote_object=""
          remote_peeled=""
          while read -r object ref; do
            if [[ "$ref" == "refs/tags/${GITHUB_REF_NAME}^{}" ]]; then
              remote_peeled="$object"
            elif [[ "$ref" == "refs/tags/${GITHUB_REF_NAME}" ]]; then
              remote_object="$object"
            fi
          done <<< "$remote_refs"
          remote_commit="${remote_peeled:-$remote_object}"
          if [[ -z "$remote_commit" || "$remote_commit" != "$expected_commit" ]]; then
            echo "Remote tag $GITHUB_REF_NAME resolves to $remote_commit, expected $expected_commit" >&2
            exit 1
          fi
          mapfile -d '' assets < <(find release-artifacts -type f -print0 | sort -z)
          if (( ${#assets[@]} == 0 )); then
            echo "No verified release assets found" >&2
            exit 1
          fi
          # Uploaded in this same create call. An installed copy asks
          # /releases/latest/download/latest.json, which GitHub resolves per request,
          # so publishing a higher version re-points it without editing anything
          # already published — the immutability gate below stays untouched.
          if [[ ! -f release-updater/latest.json ]]; then
            echo "Updater manifest was not built" >&2
            exit 1
          fi
          assets+=("release-updater/latest.json")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; publish a new version/tag instead" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
