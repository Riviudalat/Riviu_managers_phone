[package]
name = "riviu-android-driver"
version.workspace = true
edition.workspace = true
# Never published: this is a private product, not a library. Marking it here also lets
# `cargo deny` treat it as private, so the workspace's own path dependencies are not
# reported as wildcard versions and the missing `license` field is not an error.
publish = false

[dependencies]
riviu-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
async-trait = "0.1"
# For the per-gesture variation in `agent.rs`: contact time and micro-drift. Same
# version core already pins, so no second copy is built.
rand = "0.8"

[lints]
workspace = true

# `probe` carries the one decision in the measuring tools that an operator acts on blind:
# which unlabelled rectangle beside the shutter to tap. It got that order wrong, so the
# ordering is a pure function with tests, and this makes `cargo test` run them.
[[example]]
name = "probe"
path = "examples/probe.rs"
test = true

# `composer_scout --images` decides how many photos get selected on a phone holding a real
# account, and a wrong count is invisible to the operator. Two repairs of that argument both
# ended in a silent default, so the parsing is pure and tested.
[[example]]
name = "composer_scout"
path = "examples/composer_scout.rs"
test = true

[[example]]
name = "share_scout"
path = "examples/share_scout.rs"
test = true

[[example]]
name = "m7_post_once"
path = "examples/m7_post_once.rs"
test = true
