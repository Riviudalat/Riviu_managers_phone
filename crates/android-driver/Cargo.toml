[package]
name = "riviu-android-driver"
version.workspace = true
edition.workspace = true
# Never published: this is a private product, not a library. Marking it here also lets
# `cargo deny` treat it as private, so the workspace's own path dependencies are not
# reported as wildcard versions and the missing `license` field is not an error.
publish = false

[dependencies]
riviu-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
async-trait = "0.1"
# For the per-gesture variation in `agent.rs`: contact time and micro-drift. Same
# version core already pins, so no second copy is built.
rand = "0.8"
