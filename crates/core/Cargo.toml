[package]
name = "riviu-core"
version.workspace = true
edition.workspace = true
# Never published: this is a private product, not a library. Marking it here also lets
# `cargo deny` treat it as private, so the workspace's own path dependencies are not
# reported as wildcard versions and the missing `license` field is not an error.
publish = false

[dependencies]
serde = { workspace = true }
url = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
rand = "0.8"
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
futures-util = "0.3"

[dev-dependencies]
riviu-script-engine = { workspace = true }
# `test-util` only, and only for tests: it unlocks `#[tokio::test(start_paused = true)]`,
# which is what lets a 14-second arrival timeout be tested in milliseconds instead of
# actually waiting. A feature on a crate already in the graph, so `Cargo.lock` is
# untouched — verified with `cargo metadata --locked`.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
