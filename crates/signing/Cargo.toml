[package]
name = "riviu-signing"
version.workspace = true
edition.workspace = true
# Never published: this is a private product, not a library. Marking it here also lets
# `cargo deny` treat it as private, so the workspace's own path dependencies are not
# reported as wildcard versions and the missing `license` field is not an error.
publish = false

[dependencies]
riviu-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
uuid = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent"] }
