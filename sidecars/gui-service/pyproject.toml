[project]
name = "riviu-gui-service"
version = "0.2.31"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pillow>=11",
    "opencv-python-headless==4.14.0.94",
    "numpy>=2,<3",
    "tesserocr==2.10.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff", "ty", "pyinstaller>=6"]

[tool.uv.sources]
tesserocr = [{ url = "https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" }]

[tool.fastapi]
entrypoint = "riviu_gui.app:create_app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
