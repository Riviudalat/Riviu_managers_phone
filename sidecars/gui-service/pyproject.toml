[project]
name = "riviu-gui-service"
version = "0.2.30"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pillow>=11"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "ty", "pyinstaller>=6"]

[tool.fastapi]
entrypoint = "riviu_gui.app:create_app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
