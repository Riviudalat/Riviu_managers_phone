plugins {
    id "com.android.application"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-parameters"]
}

android {
    namespace "com.riviu.agent"
    compileSdk 34

    defaultConfig {
        applicationId "com.riviu.agent"
        minSdk 26
        targetSdk 34
        // Kept in step with `Protocol.AGENT_VERSION`, which is what `/status` advertises and
        // what the desktop compares against. Two version strings that disagree is how a
        // stale helper looks fresh.
        versionCode 5
        versionName "0.5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
