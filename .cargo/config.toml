# Link the MSVC C runtime statically so a Windows machine does not need the
# Visual C++ Redistributable installed. Without this the executable carries
# load-time imports on VCRUNTIME140.dll / VCRUNTIME140_1.dll, which ship with
# the redistributable rather than with Windows: on a machine that lacks it the
# app fails to start with a missing-DLL dialog, before any of our own error
# reporting can run.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
